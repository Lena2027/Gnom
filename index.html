<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Hands Craft</title>
    
    <!-- React & ReactDOM (CDN) -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- Babel (to parse JSX in browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Noto Sans', sans-serif; }
    </style>
</head>
<body class="bg-stone-50 text-stone-800 selection:bg-rose-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Icons ---
        const Icon = ({ children, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );

        const Icons = {
            Heart: (props) => <Icon {...props}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></Icon>,
            Globe: (props) => <Icon {...props}><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></Icon>,
            MessageCircle: (props) => <Icon {...props}><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></Icon>,
            ShoppingBag: (props) => <Icon {...props}><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></Icon>,
        };

        // --- Mock Data & Translations ---
        const translations = {
            en: {
                title: "Happy Hands Craft",
                subtitle: "Handmade Memories & Gnomes with Love",
                filterAll: "All Items",
                filterGnomes: "Gnomes",
                filterBears: "Memory Bears",
                contactBtn: "Message to Buy",
                footerText: "Pick up available locally. Shipping across Canada.",
                heroTitle: "Unique Handmade Gifts",
                heroDesc: "Custom Memory Bears and seasonal Gnomes made with care. Perfect for gifts and keepsakes.",
            },
            fr: {
                title: "Happy Hands Craft",
                subtitle: "Souvenirs Faits Main & Gnomes avec Amour",
                filterAll: "Tous",
                filterGnomes: "Gnomes",
                filterBears: "Oursons Mémoire",
                contactBtn: "Envoyer un message",
                footerText: "Ramassage local disponible. Livraison partout au Canada.",
                heroTitle: "Cadeaux Uniques Faits Main",
                heroDesc: "Oursons mémoire personnalisés et Gnomes saisonniers faits avec soin. Parfait pour les cadeaux et souvenirs.",
            }
        };

        const initialProducts = [
            {
                id: 1,
                name: "Toronto Maple Leafs Gnome",
                type: "gnome",
                price: 40,
                image: "https://placehold.co/400x400/003E7E/FFFFFF?text=Leafs+Gnome",
                description: { en: "Special edition sports gnome.", fr: "Gnome édition spéciale sports." }
            },
            {
                id: 2,
                name: "Montreal Canadiens Gnome",
                type: "gnome",
                price: 40,
                image: "https://placehold.co/400x400/AF1E2D/FFFFFF?text=Habs+Gnome",
                description: { en: "Go Habs Go! Handmade quality.", fr: "Allez Montréal! Qualité fait main." }
            },
            {
                id: 3,
                name: "Plaid Memory Bear",
                type: "bear",
                price: 55,
                image: "https://placehold.co/400x400/5D4037/FFFFFF?text=Memory+Bear",
                description: { en: "Made from cherished clothing.", fr: "Fabriqué à partir de vêtements chéris." }
            },
            {
                id: 4,
                name: "Classic Grey Gnome",
                type: "gnome",
                price: 35,
                image: "https://placehold.co/400x400/808080/FFFFFF?text=Grey+Gnome",
                description: { en: "Regular size, fluffy beard.", fr: "Taille régulière, barbe duveteuse." }
            },
            {
                id: 5,
                name: "Mini Red Hat Gnome",
                type: "gnome",
                price: 25,
                image: "https://placehold.co/400x400/D32F2F/FFFFFF?text=Mini+Gnome",
                description: { en: "Small size, perfect for desks.", fr: "Petite taille, parfait pour le bureau." }
            },
            {
                id: 6,
                name: "Fox Pattern Memory Bear",
                type: "bear",
                price: 55,
                image: "https://placehold.co/400x400/FF7043/FFFFFF?text=Fox+Bear",
                description: { en: "Cute fox pattern fabric.", fr: "Tissu à motif de renard mignon." }
            }
        ];

        // --- Main App Component ---
        function App() {
            const [lang, setLang] = useState('en');
            const [products] = useState(initialProducts);
            const [filter, setFilter] = useState('all');

            const t = translations[lang];
            const filteredProducts = products.filter(p => filter === 'all' ? true : p.type === filter);

            const toggleLang = () => setLang(prev => prev === 'en' ? 'fr' : 'en');
            
            // Your Facebook Message Link
            const facebookLink = "https://www.facebook.com/messages/t/"; 

            return (
                <div className="min-h-screen bg-stone-50 text-stone-800 font-sans selection:bg-rose-200 pb-10">
                    
                    {/* Navigation */}
                    <nav className="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-stone-200 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between items-center h-16">
                                {/* Logo */}
                                <div className="flex items-center gap-2">
                                    <div className="bg-rose-500 text-white p-1.5 rounded-lg">
                                        <Icons.Heart size={20} fill="currentColor" />
                                    </div>
                                    <span className="font-bold text-xl tracking-tight text-rose-900 hidden sm:block">
                                        {t.title}
                                    </span>
                                </div>

                                {/* Language Control */}
                                <div>
                                    <button onClick={toggleLang} className="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-stone-100 hover:bg-stone-200 text-sm font-medium transition-colors">
                                        <Icons.Globe size={16} />
                                        <span>{lang === 'en' ? 'FR' : 'EN'}</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </nav>

                    {/* Hero */}
                    <div className="bg-rose-50 border-b border-rose-100">
                        <div className="max-w-7xl mx-auto px-4 py-12 sm:px-6 lg:px-8 text-center">
                            <h1 className="text-4xl font-extrabold text-stone-900 sm:text-5xl sm:tracking-tight lg:text-6xl">
                                {t.title}
                            </h1>
                            <p className="mt-4 max-w-2xl mx-auto text-xl text-stone-600">
                                {t.subtitle}
                            </p>
                            <p className="mt-2 text-stone-500">{t.heroDesc}</p>
                        </div>
                    </div>

                    {/* Main Content */}
                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        
                        {/* Filters */}
                        <div className="flex justify-center mb-8">
                            <div className="bg-white p-1 rounded-xl shadow-sm border border-stone-200 inline-flex">
                                {['all', 'gnome', 'bear'].map((type) => (
                                    <button
                                        key={type}
                                        onClick={() => setFilter(type)}
                                        className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${filter === type ? "bg-stone-800 text-white shadow-sm" : "text-stone-600 hover:bg-stone-50"}`}
                                    >
                                        {type === 'all' ? t.filterAll : (type === 'gnome' ? t.filterGnomes : t.filterBears)}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* Product Grid */}
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
                            {filteredProducts.map((product) => (
                                <div key={product.id} className="bg-white rounded-2xl shadow-sm border border-stone-100 overflow-hidden hover:shadow-md transition-shadow duration-300 flex flex-col group">
                                    <div className="relative aspect-square overflow-hidden bg-stone-100">
                                        <img src={product.image} alt={product.name} className="w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-500"/>
                                        <div className="absolute top-3 right-3 bg-white/90 backdrop-blur px-3 py-1 rounded-full text-stone-900 font-bold text-sm shadow-sm">
                                            ${product.price}
                                        </div>
                                    </div>
                                    <div className="p-5 flex flex-col flex-grow">
                                        <div className="mb-4 flex-grow">
                                            <h3 className="text-lg font-bold text-stone-900 mb-1">{product.name}</h3>
                                            <p className="text-stone-500 text-sm">{product.description[lang]}</p>
                                        </div>
                                        <div className="mt-auto pt-4 border-t border-stone-100">
                                            <a href={facebookLink} target="_blank" rel="noopener noreferrer" className="w-full flex items-center justify-center gap-2 bg-rose-600 text-white py-2.5 rounded-xl hover:bg-rose-700 font-medium shadow-sm hover:shadow transition-all">
                                                <Icons.MessageCircle size={18} />
                                                {t.contactBtn}
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>

                        {/* Empty State */}
                        {filteredProducts.length === 0 && (
                            <div className="text-center py-20 text-stone-400">
                                <Icons.ShoppingBag size={48} className="mx-auto mb-4 opacity-50" />
                                <p className="text-lg">No items found.</p>
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="bg-stone-900 text-stone-400 py-12 mt-12">
                        <div className="max-w-7xl mx-auto px-4 text-center">
                            <div className="flex justify-center items-center gap-2 mb-4 text-stone-100 font-bold text-xl">
                                <Icons.Heart size={20} fill="currentColor" className="text-rose-600" />
                                {t.title}
                            </div>
                            <p className="mb-6">{t.footerText}</p>
                            <div className="text-sm opacity-60">© {new Date().getFullYear()} Happy Hands Craft</div>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

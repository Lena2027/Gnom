<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Hands Craft</title>
    
    <!-- React & ReactDOM (CDN) -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- Babel (to parse JSX in browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts (Optional but recommended) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Noto Sans', sans-serif; }
    </style>
</head>
<body class="bg-stone-50 text-stone-800 selection:bg-rose-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Icons (Inline SVGs to avoid dependencies) ---
        const Icon = ({ children, size = 24, className = "" }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width={size} 
                height={size} 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className}
            >
                {children}
            </svg>
        );

        const Icons = {
            Heart: (props) => <Icon {...props}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></Icon>,
            Globe: (props) => <Icon {...props}><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></Icon>,
            User: (props) => <Icon {...props}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></Icon>,
            Shield: (props) => <Icon {...props}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/></Icon>,
            Plus: (props) => <Icon {...props}><path d="M5 12h14"/><path d="M12 5v14"/></Icon>,
            Edit: (props) => <Icon {...props}><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></Icon>,
            Trash2: (props) => <Icon {...props}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></Icon>,
            MessageCircle: (props) => <Icon {...props}><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></Icon>,
            ShoppingBag: (props) => <Icon {...props}><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></Icon>,
            X: (props) => <Icon {...props}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></Icon>,
        };

        // --- Mock Data & Translations ---
        const translations = {
            en: {
                title: "Happy Hands Craft",
                subtitle: "Handmade Memories & Gnomes with Love",
                filterAll: "All Items",
                filterGnomes: "Gnomes",
                filterBears: "Memory Bears",
                contactBtn: "Message to Buy",
                priceSmall: "Small",
                priceRegular: "Regular",
                priceSpecial: "Special",
                priceBear: "Memory Bear",
                adminMode: "Manager Mode",
                visitorMode: "Visitor Mode",
                edit: "Edit",
                delete: "Delete",
                addNew: "Add New Item",
                footerText: "Pick up available locally. Shipping across Canada.",
                modalTitle: "Edit / Add Item",
                save: "Save Changes",
                cancel: "Cancel",
                nameLabel: "Product Name",
                priceLabel: "Price ($)",
                descLabel: "Description",
                typeLabel: "Type",
                heroTitle: "Unique Handmade Gifts",
                heroDesc: "Custom Memory Bears and seasonal Gnomes made with care. Perfect for gifts and keepsakes.",
            },
            fr: {
                title: "Happy Hands Craft",
                subtitle: "Souvenirs Faits Main & Gnomes avec Amour",
                filterAll: "Tous",
                filterGnomes: "Gnomes",
                filterBears: "Oursons Mémoire",
                contactBtn: "Envoyer un message",
                priceSmall: "Petit",
                priceRegular: "Régulier",
                priceSpecial: "Spécial",
                priceBear: "Ourson Mémoire",
                adminMode: "Mode Gérant",
                visitorMode: "Mode Visiteur",
                edit: "Modifier",
                delete: "Supprimer",
                addNew: "Ajouter un article",
                footerText: "Ramassage local disponible. Livraison partout au Canada.",
                modalTitle: "Modifier / Ajouter",
                save: "Enregistrer",
                cancel: "Annuler",
                nameLabel: "Nom du produit",
                priceLabel: "Prix ($)",
                descLabel: "Description",
                typeLabel: "Type",
                heroTitle: "Cadeaux Uniques Faits Main",
                heroDesc: "Oursons mémoire personnalisés et Gnomes saisonniers faits avec soin. Parfait pour les cadeaux et souvenirs.",
            }
        };

        const initialProducts = [
            {
                id: 1,
                name: "Toronto Maple Leafs Gnome",
                type: "gnome",
                price: 40,
                image: "https://placehold.co/400x400/003E7E/FFFFFF?text=Leafs+Gnome",
                description: { en: "Special edition sports gnome.", fr: "Gnome édition spéciale sports." }
            },
            {
                id: 2,
                name: "Montreal Canadiens Gnome",
                type: "gnome",
                price: 40,
                image: "https://placehold.co/400x400/AF1E2D/FFFFFF?text=Habs+Gnome",
                description: { en: "Go Habs Go! Handmade quality.", fr: "Allez Montréal! Qualité fait main." }
            },
            {
                id: 3,
                name: "Plaid Memory Bear",
                type: "bear",
                price: 55,
                image: "https://placehold.co/400x400/5D4037/FFFFFF?text=Memory+Bear",
                description: { en: "Made from cherished clothing.", fr: "Fabriqué à partir de vêtements chéris." }
            },
            {
                id: 4,
                name: "Classic Grey Gnome",
                type: "gnome",
                price: 35,
                image: "https://placehold.co/400x400/808080/FFFFFF?text=Grey+Gnome",
                description: { en: "Regular size, fluffy beard.", fr: "Taille régulière, barbe duveteuse." }
            },
            {
                id: 5,
                name: "Mini Red Hat Gnome",
                type: "gnome",
                price: 25,
                image: "https://placehold.co/400x400/D32F2F/FFFFFF?text=Mini+Gnome",
                description: { en: "Small size, perfect for desks.", fr: "Petite taille, parfait pour le bureau." }
            },
            {
                id: 6,
                name: "Fox Pattern Memory Bear",
                type: "bear",
                price: 55,
                image: "https://placehold.co/400x400/FF7043/FFFFFF?text=Fox+Bear",
                description: { en: "Cute fox pattern fabric.", fr: "Tissu à motif de renard mignon." }
            }
        ];

        // --- Main App Component ---
        function App() {
            const [lang, setLang] = useState('en');
            const [isAdmin, setIsAdmin] = useState(false);
            const [products, setProducts] = useState(initialProducts);
            const [filter, setFilter] = useState('all');
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [currentProduct, setCurrentProduct] = useState(null);

            const t = translations[lang];
            const filteredProducts = products.filter(p => filter === 'all' ? true : p.type === filter);

            const toggleLang = () => setLang(prev => prev === 'en' ? 'fr' : 'en');
            const toggleAdmin = () => setIsAdmin(prev => !prev);
            
            const handleDelete = (id) => {
                if (window.confirm("Are you sure?")) {
                    setProducts(products.filter(p => p.id !== id));
                }
            };

            const handleEdit = (product) => {
                setCurrentProduct(product);
                setIsModalOpen(true);
            };

            const handleAddNew = () => {
                setCurrentProduct(null);
                setIsModalOpen(true);
            };

            const handleSaveProduct = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const newProduct = {
                    id: currentProduct ? currentProduct.id : Date.now(),
                    name: formData.get('name'),
                    type: formData.get('type'),
                    price: Number(formData.get('price')),
                    image: `https://placehold.co/400x400/333333/FFFFFF?text=${formData.get('name').replace(/ /g, '+')}`,
                    description: {
                        en: formData.get('description'),
                        fr: formData.get('description') 
                    }
                };

                if (currentProduct) {
                    setProducts(products.map(p => p.id === currentProduct.id ? newProduct : p));
                } else {
                    setProducts([...products, newProduct]);
                }
                setIsModalOpen(false);
            };

            const facebookLink = "https://www.facebook.com/messages/t/"; 

            return (
                <div className="min-h-screen bg-stone-50 text-stone-800 font-sans selection:bg-rose-200 pb-10">
                    
                    {/* Navigation */}
                    <nav className="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-stone-200 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between items-center h-16">
                                {/* Logo */}
                                <div className="flex items-center gap-2">
                                    <div className="bg-rose-500 text-white p-1.5 rounded-lg">
                                        <Icons.Heart size={20} fill="currentColor" />
                                    </div>
                                    <span className="font-bold text-xl tracking-tight text-rose-900 hidden sm:block">
                                        {t.title}
                                    </span>
                                </div>

                                {/* Controls */}
                                <div className="flex items-center gap-3">
                                    <button onClick={toggleLang} className="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-stone-100 hover:bg-stone-200 text-sm font-medium transition-colors">
                                        <Icons.Globe size={16} />
                                        <span>{lang === 'en' ? 'FR' : 'EN'}</span>
                                    </button>
                                    <button onClick={toggleAdmin} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-medium transition-all ${isAdmin ? "bg-rose-600 text-white shadow-md ring-2 ring-rose-200" : "bg-stone-800 text-white hover:bg-stone-700"}`}>
                                        {isAdmin ? <Icons.Shield size={16} /> : <Icons.User size={16} />}
                                        <span className="hidden sm:inline">{isAdmin ? t.adminMode : t.visitorMode}</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </nav>

                    {/* Hero */}
                    <div className="bg-rose-50 border-b border-rose-100">
                        <div className="max-w-7xl mx-auto px-4 py-12 sm:px-6 lg:px-8 text-center">
                            <h1 className="text-4xl font-extrabold text-stone-900 sm:text-5xl sm:tracking-tight lg:text-6xl">
                                {t.title}
                            </h1>
                            <p className="mt-4 max-w-2xl mx-auto text-xl text-stone-600">
                                {t.subtitle}
                            </p>
                            <p className="mt-2 text-stone-500">{t.heroDesc}</p>
                        </div>
                    </div>

                    {/* Main */}
                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        <div className="flex flex-col sm:flex-row justify-between items-center mb-8 gap-4">
                            <div className="bg-white p-1 rounded-xl shadow-sm border border-stone-200 inline-flex">
                                {['all', 'gnome', 'bear'].map((type) => (
                                    <button
                                        key={type}
                                        onClick={() => setFilter(type)}
                                        className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${filter === type ? "bg-stone-800 text-white shadow-sm" : "text-stone-600 hover:bg-stone-50"}`}
                                    >
                                        {type === 'all' ? t.filterAll : (type === 'gnome' ? t.filterGnomes : t.filterBears)}
                                    </button>
                                ))}
                            </div>
                            {isAdmin && (
                                <button onClick={handleAddNew} className="flex items-center gap-2 bg-green-600 text-white px-5 py-2.5 rounded-lg hover:bg-green-700 shadow-sm transition-colors font-medium">
                                    <Icons.Plus size={18} />
                                    {t.addNew}
                                </button>
                            )}
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
                            {filteredProducts.map((product) => (
                                <div key={product.id} className="bg-white rounded-2xl shadow-sm border border-stone-100 overflow-hidden hover:shadow-md transition-shadow duration-300 flex flex-col group">
                                    <div className="relative aspect-square overflow-hidden bg-stone-100">
                                        <img src={product.image} alt={product.name} className="w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-500"/>
                                        <div className="absolute top-3 right-3 bg-white/90 backdrop-blur px-3 py-1 rounded-full text-stone-900 font-bold text-sm shadow-sm">
                                            ${product.price}
                                        </div>
                                    </div>
                                    <div className="p-5 flex flex-col flex-grow">
                                        <div className="mb-4 flex-grow">
                                            <h3 className="text-lg font-bold text-stone-900 mb-1">{product.name}</h3>
                                            <p className="text-stone-500 text-sm">{product.description[lang]}</p>
                                        </div>
                                        <div className="mt-auto pt-4 border-t border-stone-100">
                                            {isAdmin ? (
                                                <div className="flex gap-2">
                                                    <button onClick={() => handleEdit(product)} className="flex-1 flex items-center justify-center gap-2 bg-blue-50 text-blue-700 py-2 rounded-lg hover:bg-blue-100 font-medium text-sm transition-colors">
                                                        <Icons.Edit size={16} /> {t.edit}
                                                    </button>
                                                    <button onClick={() => handleDelete(product.id)} className="flex items-center justify-center gap-2 bg-red-50 text-red-700 px-4 py-2 rounded-lg hover:bg-red-100 font-medium text-sm transition-colors">
                                                        <Icons.Trash2 size={16} />
                                                    </button>
                                                </div>
                                            ) : (
                                                <a href={facebookLink} target="_blank" rel="noopener noreferrer" className="w-full flex items-center justify-center gap-2 bg-rose-600 text-white py-2.5 rounded-xl hover:bg-rose-700 font-medium shadow-sm hover:shadow transition-all">
                                                    <Icons.MessageCircle size={18} />
                                                    {t.contactBtn}
                                                </a>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>

                        {filteredProducts.length === 0 && (
                            <div className="text-center py-20 text-stone-400">
                                <Icons.ShoppingBag size={48} className="mx-auto mb-4 opacity-50" />
                                <p className="text-lg">No items found.</p>
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="bg-stone-900 text-stone-400 py-12 mt-12">
                        <div className="max-w-7xl mx-auto px-4 text-center">
                            <div className="flex justify-center items-center gap-2 mb-4 text-stone-100 font-bold text-xl">
                                <Icons.Heart size={20} fill="currentColor" className="text-rose-600" />
                                {t.title}
                            </div>
                            <p className="mb-6">{t.footerText}</p>
                            <div className="text-sm opacity-60">© {new Date().getFullYear()} Happy Hands Craft</div>
                        </div>
                    </footer>

                    {/* Modal */}
                    {isModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
                            <div className="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden animate-in fade-in zoom-in duration-200">
                                <div className="px-6 py-4 border-b border-stone-100 flex justify-between items-center bg-stone-50">
                                    <h3 className="font-bold text-lg text-stone-800">{t.modalTitle}</h3>
                                    <button onClick={() => setIsModalOpen(false)} className="text-stone-400 hover:text-stone-600">
                                        <Icons.X size={20} />
                                    </button>
                                </div>
                                <form onSubmit={handleSaveProduct} className="p-6 space-y-4">
                                    <div>
                                        <label className="block text-sm font-medium text-stone-700 mb-1">{t.nameLabel}</label>
                                        <input name="name" defaultValue={currentProduct?.name} required className="w-full px-3 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-rose-500 outline-none"/>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-medium text-stone-700 mb-1">{t.typeLabel}</label>
                                            <select name="type" defaultValue={currentProduct?.type || 'gnome'} className="w-full px-3 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-rose-500 outline-none bg-white">
                                                <option value="gnome">Gnome</option>
                                                <option value="bear">Bear</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-stone-700 mb-1">{t.priceLabel}</label>
                                            <input name="price" type="number" defaultValue={currentProduct?.price} required className="w-full px-3 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-rose-500 outline-none"/>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-stone-700 mb-1">{t.descLabel}</label>
                                        <textarea name="description" defaultValue={currentProduct?.description?.en} required rows="3" className="w-full px-3 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-rose-500 outline-none resize-none"></textarea>
                                    </div>
                                    <div className="pt-2 flex gap-3">
                                        <button type="button" onClick={() => setIsModalOpen(false)} className="flex-1 px-4 py-2 border border-stone-300 text-stone-700 rounded-lg hover:bg-stone-50 font-medium">{t.cancel}</button>
                                        <button type="submit" className="flex-1 px-4 py-2 bg-rose-600 text-white rounded-lg hover:bg-rose-700 font-medium shadow-sm">{t.save}</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
